services:

  # --- NGINX ---
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      flask-app:
        condition: service_healthy

  # --- MySQL ---
  mysql:
    image: mysql:8.0
    container_name: mysql
    secrets:
      - db_root_pw
      - db_admin_pw
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_pw
      MYSQL_DATABASE: mydb
      MYSQL_USER: admin
      MYSQL_PASSWORD_FILE: /run/secrets/db_admin_pw
    command:
      - mysqld
      - --slow_query_log=1
      - --slow_query_log_file=/var/log/mysql/slow.log
      - --long_query_time=1
      - --log-error-verbosity=2
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-logs:/var/log/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --password=$$(cat /run/secrets/db_root_pw)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # --- FLASK APP ---
  flask-app:
    image: ghcr.io/atkaridarshan04/docker-stack/flask-app:1.2.0
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flask-app
    secrets:
      - db_admin_pw
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: admin
      MYSQL_PASSWORD_FILE: /run/secrets/db_admin_pw
      MYSQL_DB: mydb
      FLASK_DEBUG: "0"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  # --- CADVISOR ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --store_container_labels=true
      - --disable_metrics=disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - app-net
    restart: unless-stopped

  # --- GRAFANA ALLOY ---
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /run:/run:ro
      - /var/log:/var/log:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/udev/data:/run/udev/data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - mysql-logs:/alloy/mysql-logs:ro
    networks:
      - app-net
    restart: unless-stopped

  # --- MYSQL EXPORTER ---
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: mysqld-exporter
    secrets:
      - db_admin_pw
    entrypoint:
      - sh
      - -c
      - |
        printf '[client]\nuser=admin\npassword=%s\nhost=mysql\nport=3306\n' "$$(cat /run/secrets/db_admin_pw)" > /tmp/my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/my.cnf \
          --collect.info_schema.innodb_metrics \
          --collect.info_schema.tables \
          --collect.global_status \
          --collect.global_variables
    ports:
      - "9104:9104"
    networks:
      - app-net
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  # --- BLACKBOX EXPORTER ---
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    volumes:
      - ./configs/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "9115:9115"
    networks:
      - app-net
    restart: unless-stopped

  # --- PROMETHEUS ---
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - data_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    networks:
      - app-net
    restart: unless-stopped

  # --- LOKI ---
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/config.yaml:ro
      - data_loki:/loki
    networks:
      - app-net
    restart: unless-stopped

  # --- GRAFANA ---
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - app-net
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

networks:
  app-net:
    name: app-net

volumes:
  mysql-data:
  mysql-logs:
  alloy_data:
  data_loki:
  data_prometheus:
  grafana-data:

secrets:
  db_root_pw:
    file: ./secrets/db_root_pw.txt
  db_admin_pw:
    file: ./secrets/db_admin_pw.txt
